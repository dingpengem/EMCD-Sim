[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emcd-sim"
version = "0.4.2"
description = "Research-stage EMCD forward-simulation framework with an FCC Ni benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "EMCD-Sim contributors"}]
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
emcd-ni = "emcd_sim.cli:main"
emcd-scan = "emcd_sim.scan:main"
emcd-convergence = "emcd_sim.convergence:main"
emcd-compare = "emcd_sim.compare_conditions:main"
emcd-elastic-reference = "emcd_sim.elastic_reference:main"
emcd-mdff = "emcd_sim.mdff_reference:main"
emcd-ni-atomic = "emcd_sim.ni_atomic_reference:main"
emcd-ni-local-mdff = "emcd_sim.ni_local_mdff:main"
emcd-import-transitions = "emcd_sim.transition_csv:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
