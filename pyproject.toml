[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emcd-sim"
version = "0.3.0"
description = "Research-stage EMCD forward-simulation framework with an FCC Ni benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "EMCD-Sim contributors"}]
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
emcd-ni = "emcd_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
