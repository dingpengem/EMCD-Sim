[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emcd-sim"
version = "0.6.1b2"
description = "Research-stage EMCD forward-simulation framework with an FCC Ni benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "EMCD-Sim contributors"}]
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
gui = ["PySide6>=6.6", "ase>=3.23"]

[project.scripts]
emcd-gui = "emcd_sim.gui:main"
emcd-import-transitions = "emcd_sim.transition_csv:main"
emcd-ni-local-mdff = "emcd_sim.ni_local_mdff:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
