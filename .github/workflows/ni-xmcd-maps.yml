name: Generate indexed Ni XMCD EMCD maps
on:
  workflow_dispatch:
  push:
    paths:
      - "data/wien2k_ni/Ni_fm.xmcd"
      - "src/emcd_sim/xmcd_indexed_maps.py"
      - ".github/workflows/ni-xmcd-maps.yml"
permissions:
  contents: write
jobs:
  calculate-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model
        run: python -m pip install -e '.[dev]'
      - name: Create indexed maps
        run: |
          python -m emcd_sim.xmcd_indexed_maps \
            --xmcd-file data/wien2k_ni/Ni_fm.xmcd \
            --output examples/ni_xmcd_indexed \
            --thickness-nm 30 --grid 65 --steps 64
      - name: Commit calculated maps and indexing metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f examples/ni_xmcd_indexed
          git diff --cached --quiet || git commit -m "Add computed indexed Ni XMCD L2/L3 EMCD maps [skip ci]"
          git push
