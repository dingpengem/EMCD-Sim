name: Generate indexed Ni XMCD and EMCD results
on:
  workflow_dispatch:
  push:
    paths:
      - "data/wien2k_ni/Ni_fm.xmcd"
      - "src/emcd_sim/xmcd_indexed_maps.py"
      - "src/emcd_sim/plot_wien2k_xmcd_suite.py"
      - ".github/workflows/ni-xmcd-maps.yml"
permissions:
  contents: write
concurrency:
  group: ni-xmcd-examples
  cancel-in-progress: false
jobs:
  calculate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Generate WIEN2k XAS / XMCD figures
        run: |
          python -m emcd_sim.plot_wien2k_xmcd_suite \
            --xmcd-file data/wien2k_ni/Ni_fm.xmcd \
            --output-dir examples/ni_dft_xas_xmcd
      - name: Run indexed diffraction and EMCD maps
        run: |
          python -m emcd_sim.xmcd_indexed_maps \
            --xmcd-file data/wien2k_ni/Ni_fm.xmcd \
            --output examples/ni_emcd_dft_constrained \
            --thickness-nm 30 --grid 65 --steps 64
      - name: Verify all four condition output sets
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('examples/ni_emcd_dft_constrained')
          required=('diffraction_pattern.png','diffraction_pattern.npz',
                    'diffraction_spots.csv','emcd_L23_indexed.png',
                    'emcd_L3_map.npz','emcd_L2_map.npz',
                    'emcd_spectra.npz','metadata.json')
          for name in ('zone-axis','two-beam','near-2bc','symmetric-3bc'):
              folder=base/name
              missing=[f for f in required if not (folder/f).is_file() or (folder/f).stat().st_size==0]
              if missing: raise SystemExit(f'{name} missing/empty: {missing}')
              print(name,'verified',len(required),'outputs')
          for name in ('ni_dft_xmcd.png','ni_dft_xmcd.svg',
                       'ni_dft_xmcd_zoom_L3L2.png','ni_dft_xmcd_zoom_L3L2.svg'):
              if not (Path('examples/ni_dft_xas_xmcd')/name).is_file(): raise SystemExit(f'Missing figure {name}')
          PY
      - name: Commit all generated images and numerical results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f examples/ni_dft_xas_xmcd examples/ni_emcd_dft_constrained
          git diff --cached --quiet || git commit -m "Save calculated Ni XMCD and indexed EMCD results [skip ci]"
          git push
