name: Publish FCC Ni condition maps

on:
  push:
    branches: [main]
    paths:
      - 'src/emcd_sim/compare_conditions.py'
      - '.github/workflows/publish-condition-maps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install EMCD-Sim
        run: python -m pip install -e .
      - name: Render reproducible example maps
        run: python -m emcd_sim.compare_conditions --output examples/ni_condition_maps
      - name: Commit generated image and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/ni_condition_maps/emcd_diffraction_conditions.png examples/ni_condition_maps/emcd_diffraction_conditions.svg examples/ni_condition_maps/emcd_condition_maps.npz examples/ni_condition_maps/comparison_metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "Render reproducible FCC Ni diffraction-condition EMCD maps"
            git push origin main
          fi
