name: Windows Beta candidate

on:
  push:
    branches: [main]
    paths: ['src/**', 'packaging/**', 'pyproject.toml', '.github/workflows/windows-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build and GUI dependencies
        run: python -m pip install -e ".[dev,gui]" -r packaging/requirements-windows.txt
      - name: Focused source GUI and version checks
        run: >-
          python -m pytest -q tests/test_gui_responsive.py tests/test_diffraction_view_toggle.py
          tests/test_gui_stage_a.py::InteractionTests::test_zoomed_mouse_coordinates_reflection_and_stale_state
          tests/test_v060_presentation.py::test_eels_widgets_modes_lock_and_no_calculation
          tests/test_portability.py::test_version_matches_source_metadata
      - name: Build portable Windows ZIP
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python (Get-Command python).Source -BuildRoot build/windows-beta3
      - name: Test extracted standalone EXE
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath build/windows-beta3/EMCD-Sim-v0.6.1-beta.3-Windows.zip -DestinationPath build/windows-beta3/extracted
          $exe = (Resolve-Path build/windows-beta3/extracted/EMCD-Sim/EMCD-Sim.exe).Path
          $validation = Join-Path (Get-Location) 'build/windows-beta3/validation'
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:PYTHONPATH,Env:PYTHONHOME,Env:CONDA_PREFIX -ErrorAction SilentlyContinue
          foreach ($orientation in @('017','117','001','111','710')) {
            $destination = Join-Path $validation $orientation
            $process = Start-Process -FilePath $exe -ArgumentList @('--desktop-acceptance',$destination,'--desktop-orientation',$orientation) -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Frozen acceptance $orientation failed: $($process.ExitCode)" }
            $report = Get-Content -LiteralPath "$destination/acceptance.json" -Raw | ConvertFrom-Json
            if (-not $report.complete -or -not $report.frozen -or -not $report.closed_cleanly) { throw 'Invalid frozen acceptance report' }
            if ($report.build.commit -ne '${{ github.sha }}') { throw 'Source commit mismatch' }
            if ($report.build.application_version -ne '0.6.1b3') { throw 'Version mismatch' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EMCD-Sim-v0.6.1-beta.3-Windows
          compression-level: 0
          retention-days: 30
          path: |
            build/windows-beta3/EMCD-Sim-v0.6.1-beta.3-Windows.zip
            build/windows-beta3/SHA256SUMS.txt
            build/windows-beta3/build_manifest.json
            build/windows-beta3/validation/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-beta3-diagnostics
          path: |
            build/windows-beta3/validation/
            build/windows-beta3/build_manifest.json
