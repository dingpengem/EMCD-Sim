name: Windows Beta candidate

on:
  push:
    branches: [main]
    paths: ['src/**', 'packaging/**', 'pyproject.toml', '.github/workflows/windows-build.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional immutable tag or commit to build (workflow remains at dispatch ref)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Verify requested build source
        shell: pwsh
        env:
          REQUESTED_REF: ${{ inputs.source_ref || github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = (git rev-parse "$($env:REQUESTED_REF)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'Requested checkout source mismatch' }
          Write-Host "Workflow source: $env:WORKFLOW_SHA; requested build ref: $env:REQUESTED_REF; actual build source: $actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build and GUI dependencies
        run: python -m pip install -e ".[dev,gui]" -r packaging/requirements-windows.txt
      - name: Focused source GUI and version checks
        run: >-
          python -m pytest -q tests/test_gui_responsive.py tests/test_diffraction_view_toggle.py
          tests/test_gui_stage_a.py::InteractionTests::test_zoomed_mouse_coordinates_reflection_and_stale_state
          tests/test_v060_presentation.py::test_eels_widgets_modes_lock_and_no_calculation
          tests/test_portability.py::test_version_matches_source_metadata
      - name: Build portable Windows ZIP
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python (Get-Command python).Source -BuildRoot build/windows-v0.9.0-beta.2
      - name: Test extracted standalone EXE
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath build/windows-v0.9.0-beta.2/EMCD-Sim-v0.9.0-beta.2-Windows.zip -DestinationPath build/windows-v0.9.0-beta.2/extracted
          $exe = (Resolve-Path build/windows-v0.9.0-beta.2/extracted/EMCD-Sim/EMCD-Sim.exe).Path
          $validation = Join-Path (Get-Location) 'build/windows-v0.9.0-beta.2/validation'
          $sourceCommit = (git rev-parse HEAD).Trim()
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:PYTHONPATH,Env:PYTHONHOME,Env:CONDA_PREFIX -ErrorAction SilentlyContinue
          foreach ($orientation in @('017','117','001','111','710')) {
            $destination = Join-Path $validation $orientation
            $process = Start-Process -FilePath $exe -ArgumentList @('--desktop-acceptance',$destination,'--desktop-orientation',$orientation) -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Frozen acceptance $orientation failed: $($process.ExitCode)" }
            $report = Get-Content -LiteralPath "$destination/acceptance.json" -Raw | ConvertFrom-Json
            if (-not $report.complete -or -not $report.frozen -or -not $report.closed_cleanly) { throw 'Invalid frozen acceptance report' }
            if ($report.build.commit -ne $sourceCommit) { throw 'Source commit mismatch' }
            if ($report.build.application_version -ne '0.9.0b2') { throw 'Version mismatch' }
            if ($report.build.physics_convention -ne 'forward_born_dagger_g_minus_h_v1') { throw 'Physics convention mismatch' }
          }
      - name: Test generalized imported and atomic workflows in extracted EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/windows-v0.9.0-beta.2/extracted/EMCD-Sim/EMCD-Sim.exe).Path
          $destination = Join-Path (Get-Location) 'build/windows-v0.9.0-beta.2/validation/generalized'
          $sourceCommit = (git rev-parse HEAD).Trim()
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:PYTHONPATH,Env:PYTHONHOME,Env:CONDA_PREFIX -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList @('--release-acceptance',$destination) -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Generalized frozen acceptance failed: $($process.ExitCode)" }
          $report = Get-Content -LiteralPath "$destination/acceptance.json" -Raw | ConvertFrom-Json
          if (-not $report.complete -or -not $report.frozen -or -not $report.closed_cleanly -or $report.cases.Count -ne 14) { throw 'Invalid generalized frozen report' }
          if ($report.build.commit -ne $sourceCommit -or $report.build.application_version -ne '0.9.0b2') { throw 'Generalized source/version mismatch' }
          if ($report.build.physics_convention -ne 'forward_born_dagger_g_minus_h_v1') { throw 'Generalized physics convention mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: EMCD-Sim-v0.9.0-beta.2-Windows
          compression-level: 0
          retention-days: 30
          path: |
            build/windows-v0.9.0-beta.2/EMCD-Sim-v0.9.0-beta.2-Windows.zip
            build/windows-v0.9.0-beta.2/SHA256SUMS.txt
            build/windows-v0.9.0-beta.2/build_manifest.json
            build/windows-v0.9.0-beta.2/validation/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-v090b2-diagnostics
          path: |
            build/windows-v0.9.0-beta.2/validation/
            build/windows-v0.9.0-beta.2/build_manifest.json
